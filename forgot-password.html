<body>
<main class="forgot-wrap"><section class="forgot-card">
<div class="forgot-icon"><i class="fa-solid fa-key"></i></div>
<h1>Forgot Password?</h1>
<p>Enter the Gmail address you used to create your account. We will email you a secure password reset link.</p>
<form id="forgotForm">
<label class="forgot-field">Email Address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
<button class="forgot-submit" type="submit">Send Reset Link</button>
</form>
<p class="forgot-message" id="forgotMessage" role="status" aria-live="polite"></p>
<div class="forgot-links"><a href="/login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a><a href="/index.html">Back to Home</a></div>
</section></main>
<script>
const RESET_API_URL="https://bold-surf-9356.taijulsheikh60.workers.dev/api/auth/forgot-password";
const form=document.getElementById("forgotForm"),message=document.getElementById("forgotMessage"),button=form.querySelector("button");
form.addEventListener("submit",async e=>{
 e.preventDefault();message.textContent="";button.disabled=true;button.textContent="Sending...";
 try{
  const response=await fetch(RESET_API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:form.email.value.trim()})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error||"Request failed");
  message.style.color="#39f5a5";
  message.textContent="If this email belongs to a verified account, a password reset link has been sent. Please check Inbox and Spam.";
  form.reset();
 }catch(err){
  message.style.color="#fca5a5";
  message.textContent="Could not process your request right now. Please try again later.";
 }finally{button.disabled=false;button.textContent="Send Reset Link";}
});
</script>
